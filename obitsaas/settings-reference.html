<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ObitSAAS Settings</title><style>:root{font-family:Arial,sans-serif;color:#262626;background:#f8f8f5}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}aside{background:#fffbe1;padding:24px 18px}aside h2{color:#087e57}nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:9px;cursor:pointer;color:#444}nav button.active,nav button:hover{background:#e7f2e8;color:#087e57}main{min-width:0}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px 25px;border-bottom:1px solid #eee;background:white}.workspace{font-weight:bold;color:#087e57}.body{padding:30px;max-width:1250px;margin:auto}.subtitle{color:#777}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}.card{background:#fff;border:1px solid #e6e6e6;border-radius:14px;padding:18px;min-height:140px;text-align:left;cursor:pointer}.card:hover{border-color:#0b865e;box-shadow:0 4px 12px #0001}.glyph{display:inline-grid;place-items:center;width:34px;height:34px;background:#fff8e8;color:#bc8c22;border-radius:10px}.card h3{margin:13px 0 8px}.card p{font-size:13px;color:#777;line-height:1.5}.back{background:none;border:0;cursor:pointer;color:#087e57;padding:10px 0}.panel{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:24px;margin-top:24px}.notice{background:#fff9e8;border:1px solid #e9d8a0;border-radius:8px;padding:12px;color:#725619}input{padding:12px;border:1px solid #ccc;border-radius:8px;max-width:100%;width:350px}label{display:block;margin:18px 0 8px}button.primary{background:#087e57;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}.status{margin-top:12px;color:#087e57}@media(max-width:850px){.app{grid-template-columns:1fr}aside{padding:12px}nav{display:flex;overflow:auto;gap:4px}nav button{width:auto;white-space:nowrap}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.body{padding:18px}}@media(max-width:520px){.cards{grid-template-columns:1fr}.toolbar{padding:12px}.card{min-height:120px}}</style></head><body><div class="app"><aside><h2>ObitSAAS</h2><button class="back" id="dashboard">← Back to Settings</button><nav id="nav"></nav></aside><main><header class="toolbar"><span class="workspace">ObitSAAS / Settings</span><span>Workspace ▾ &nbsp; ☼ &nbsp; ♙</span></header><section class="body" id="view"></section></main></div><script>const items=[["Vault","lock","Centralized media library for uploaded files and assets."],["Staff","users","Manage team, roles, permissions and departments."],["Tags","tag","Organize contacts and records with reusable labels."],["Values","braces","Configure dropdowns, statuses and reusable value sets."],["Fields","grid","Create custom fields for contacts, companies and records."],["Templates","file","Reusable templates for notes, outreach and documents."],["App Store","store","Connect Google, Meta, WhatsApp, Zoom and more."],["Domains","globe","Manage custom domains and DNS records."],["Wallet","wallet","Review wallet credits and transactions."],["Analytics","chart","Cross-module performance and insights."],["Notifications","bell","Choose alerts and delivery channels."],["Deleted Items","trash","Restore recently deleted items."],["Customize","settings","Manage workspace appearance and preferences."]];const nav=document.getElementById('nav'),view=document.getElementById('view');let current='';function go(name){current=name;location.hash=name?encodeURIComponent(name):'';render()}function render(){nav.innerHTML=items.map(([n],i)=>'<button class="'+(current===n?'active':'')+'" data-i="'+i+'">'+n+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(items[Number(b.dataset.i)][0]));document.getElementById('dashboard').textContent=current?'← Back to Settings':'← Settings overview';document.getElementById('dashboard').onclick=()=>go('');if(!current){view.innerHTML='<h1>Settings</h1><p class="subtitle">Manage your workspace, team, integrations, and preferences.</p><div class="cards">'+items.map(([n,icon,description],i)=>'<button class="card" data-i="'+i+'"><span class="glyph">✦</span><h3>'+n+'</h3><p>'+description+'</p></button>').join('')+'</div>';view.querySelectorAll('.card').forEach(b=>b.onclick=()=>go(items[Number(b.dataset.i)][0]));return}const item=items.find(x=>x[0]===current);if(!item){go('');return}view.innerHTML='<button class="back" id="back">← All settings</button><h1>'+item[0]+'</h1><p class="subtitle">'+item[2]+'</p><div class="panel"><p class="notice">This section is a navigation prototype. Production data, integration connections and permissions are not connected yet.</p><label for="note">Workspace note (saved in this browser only)</label><input id="note" placeholder="Enter a note"><p><button class="primary" id="save">Save note</button></p><p class="status" id="status"></p></div>';document.getElementById('back').onclick=()=>go('');const key='obitsaas-settings-note-'+current;document.getElementById('note').value=localStorage.getItem(key)||'';document.getElementById('save').onclick=()=>{localStorage.setItem(key,document.getElementById('note').value);document.getElementById('status').textContent='Saved locally in this browser.'}}window.addEventListener('hashchange',()=>{current=decodeURIComponent(location.hash.slice(1));render()});current=decodeURIComponent(location.hash.slice(1));render();</script></body></html>
