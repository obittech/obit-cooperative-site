name: SafePay v2 Validation
on:
  push:
    branches: [feature/obit-market-safepay-v2]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Syntax check
        run: find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: SQLite schema and API boot
        env:
          AUTH_TOKEN_SECRET: ci-only-secret
          DB_PATH: /tmp/obit-safepay-ci.db
          NODE_ENV: test
          PORT: 10003
        run: |
          node --experimental-sqlite src/server.js > /tmp/obit-safepay-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:10003/api/readiness >/tmp/readiness.json; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:10003/api/readiness
          curl -fsS http://127.0.0.1:10003/api/safepay/status
