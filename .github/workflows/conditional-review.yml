name: Conditional application review
on:
  pull_request:
    branches: [main]
jobs:
  postgres-review:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conditional_review_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d conditional_review_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Isolated PostgreSQL review and interleaving regressions
        env:
          DB_ENGINE: postgres
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/conditional_review_ci
          PGSSL: disable
        run: node --experimental-sqlite --test test/application-review.test.js
  browser-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Chromium mobile and desktop limited portal
        run: node tests/limited-portal-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: limited-portal-responsive-screenshots
          path: browser-artifacts
