name: Backend validation
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-validation.yml'
  push:
    branches:
      - feature/postgres-runtime
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: |
          find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: SQLite migration smoke test
        env:
          DB_ENGINE: sqlite
          DB_PATH: /tmp/obit-ci.db
        run: |
          node --experimental-sqlite --input-type=module -e "const m=await import('./src/db.js'); await m.migrate(); const r=await m.get('SELECT 1 AS ok'); if(Number(r.ok)!==1) process.exit(1); console.log('sqlite smoke ok')"
