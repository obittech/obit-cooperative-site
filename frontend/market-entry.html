<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Seller sign-in | Obit Marketplace</title>
  <meta name="description" content="Sign in with your cooperative membership code and password to sell on Obit Marketplace.">
  <link rel="canonical" href="https://marketplace.obitcooperative.com/market-entry.html">
  <link rel="stylesheet" href="styles.css?v=20261101-navigation">
  <link rel="stylesheet" href="app.css?v=20261101-readable-consent">
  <link rel="stylesheet" href="market-entry.css?v=20261101-seller-steps">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header"><div class="container nav-wrap">
    <a class="brand" href="https://marketplace.obitcooperative.com/"><img class="brand-logo" src="assets/obit-logo.png" alt=""><span><strong>OBIT MARKET</strong><small>BUY AND SELL</small></span></a>
    <a class="cooperative-link" href="market.html">Back to shopping</a>
  </div></header>
  <main id="main-content" class="container entry-main">
    <h1>Sell on Obit</h1>
    <div class="entry-grid">
      <section class="card entry-card" id="sellerLogin" aria-labelledby="sellerHeading">
        <h2 id="sellerHeading">Seller sign-in</h2>
        <p id="sellerStepLabel">Step 1 of 2: Enter your cooperative membership code.</p>
        <form id="sellerEntryForm">
          <label class="field" for="sellerMemberCode">Membership code<input id="sellerMemberCode" name="membership_code" required maxlength="64" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="e.g. OBT-2026-000123"></label>
          <fieldset id="sellerPasswordStep" hidden disabled>
            <label class="field" for="sellerPassword">Password<input id="sellerPassword" name="password" type="password" required autocomplete="current-password"></label>
            <button class="text-button" id="sellerChangeCode" type="button">Change membership code</button>
          </fieldset>
          <button class="btn btn-primary" id="sellerContinue" type="submit">Next</button>
        </form>
        <p id="sellerEntryStatus" role="status" aria-live="polite"></p>
        <p><a href="portal.html">Set up or recover my password</a></p>
        <p><a href="https://obitcooperative.com/apply.html">Not a member? Apply for membership</a></p>
      </section>
    </div>
  </main>
  <footer><div class="container footer-bottom"><span>Obit Marketplace</span><a href="https://obitcooperative.com/">Visit Obit Cooperative</a></div></footer>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/market-entry.js?v=20261101-seller-steps"></script>
</body>
</html>
