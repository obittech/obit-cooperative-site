services:
  - type: cron
    name: obit-affirmations-rehearsal
    runtime: docker
    branch: obit-affirmations-encoder
    rootDir: obit-encoder
    region: oregon
    plan: 2c-4g
    # Daily target: 0 6 * * * (07:00 Africa/Lagos).
    # Remains disabled until owner OAuth and daily lifecycle validation.
    schedule: "0 0 1 1 *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    envVars:
      - key: ENABLE_REHEARSAL
        value: "false"
      - key: ENABLE_RECORDED
        value: "false"
      - key: BROADCAST_MODE
        value: rehearsal
      - key: DESTINATION_VISIBILITY
        value: unlisted
      - key: YOUTUBE_STREAM_KEY
        sync: false
