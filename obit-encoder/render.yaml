services:
  - type: cron
    name: obit-affirmations-rehearsal
    runtime: docker
    branch: obit-affirmations-encoder
    rootDir: obit-encoder
    region: oregon
    plan: 2c-4g
    # Daily at 07:00 Africa/Lagos. Full lifecycle test passed on 2026-10-08.
    schedule: "0 6 * * *"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    envVars:
      - key: ENABLE_REHEARSAL
        value: "false"
      - key: ENABLE_RECORDED
        value: "true"
      - key: BROADCAST_MODE
        value: daily
      - key: DESTINATION_VISIBILITY
        value: public
      - key: YOUTUBE_STREAM_KEY
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
